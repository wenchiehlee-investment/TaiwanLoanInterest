name: Monthly CBC Data Update

on:
  workflow_dispatch: {}
  schedule:
    # Runs monthly. GitHub Actions cron is UTC.
    - cron: "0 3 2 * *"

permissions:
  contents: write

concurrency:
  group: monthly-cbc-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-microhei
          sudo fc-cache -f -v

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update 5newloan (Monthly)
        run: |
          python3 src/5newloan.py --plot

      - name: Update AVERAGEIR (Quarterly)
        run: |
          python3 src/averageir.py --plot

      - name: Commit And Push If Changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto update CBC datasets"
          git push

  sync-to-biztrends:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Sync raw CSVs to biztrends.TW
        id: sync_biztrends
        continue-on-error: true  # retried below on failure (e.g. biztrends.TW ref-lock race)
        uses: BetaHuhn/repo-file-sync-action@latest
        with:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY1 }}
          CONFIG_PATH: .github/sync-biztrends.yml
          COMMIT_EACH_FILE: false
          PR_LABELS: "automated-sync"
          SKIP_PR: true

      - name: Wait before retrying biztrends.TW sync
        if: steps.sync_biztrends.outcome == 'failure'
        run: sleep $((45 + RANDOM % 90))

      - name: Sync raw CSVs to biztrends.TW (retry)
        if: steps.sync_biztrends.outcome == 'failure'
        uses: BetaHuhn/repo-file-sync-action@latest
        with:
          GH_PAT: ${{ secrets.REPO_FILE_SYNC_WENCHIEHLEE_MONEY1 }}
          CONFIG_PATH: .github/sync-biztrends.yml
          COMMIT_EACH_FILE: false
          PR_LABELS: "automated-sync"
          SKIP_PR: true

